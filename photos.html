<!--DOWN SITE-->
<img src="pics/car.gif" alt="Nyan Cat" id="nyanCat" class="nyan-cat">
<script>
  const nyanCat = document.getElementById('nyanCat');
  function startFlying() {
    const randomY = Math.floor(Math.random() * 80) + 5;
    nyanCat.style.top = randomY + 'vh';
    nyanCat.classList.add('flying');
  }
  nyanCat.addEventListener('animationend', () => {
    nyanCat.classList.remove('flying');
    setTimeout(startFlying, 0);
  });
  startFlying();
</script>

<div id="pacmanGroup" class="pacman-group">
  <img src="pics/pacman.gif" alt="Pac-Man" class="pac-sprite">
  <img id="ghostImg" src="pics/redgh.gif" alt="Ghost" class="pac-sprite">
</div>
<script>
  const pacmanGroup = document.getElementById('pacmanGroup');
  const ghostImg = document.getElementById('ghostImg');
  const ghosts = [
    'pics/redgh.gif',
    'pics/yellgh.gif',
    'pics/bluegh.gif'
  ];

  function startChase() {
    const randomGhost = ghosts[Math.floor(Math.random() * ghosts.length)];
    const randomSpeed = (Math.random() * 4 + 4).toFixed(1);
    const randomGap = Math.floor(Math.random() * 100) + 40;

    ghostImg.src = randomGhost;
    pacmanGroup.style.setProperty('--speed', randomSpeed + 's');
    pacmanGroup.style.setProperty('--gap', randomGap + 'px');

    pacmanGroup.classList.add('chasing');
  }

  pacmanGroup.addEventListener('animationend', () => {
    pacmanGroup.classList.remove('chasing');
    setTimeout(startChase, 1000);
  });

  startChase();
</script>
